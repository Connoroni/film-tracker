<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Film calendar</title>
    <style>
      :root {
        --bg: #fafaf9;
        --surface: #fff;
        --text: #1c1917;
        --muted: #78716c;
        --line: #e7e5e4;
        --accent: #4f46e5;
        --accent-text: #fff;
        --done: #16a34a;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0c0a09;
          --surface: #1c1917;
          --text: #f5f5f4;
          --muted: #a8a29e;
          --line: #2e2a28;
          --accent: #818cf8;
          --accent-text: #0c0a09;
          --done: #4ade80;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0c0a09;
        --surface: #1c1917;
        --text: #f5f5f4;
        --muted: #a8a29e;
        --line: #2e2a28;
        --accent: #818cf8;
        --accent-text: #0c0a09;
        --done: #4ade80;
        color-scheme: dark;
      }
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.45 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 20px 16px 48px;
      }
      h1 {
        font-size: 1.1rem;
        font-weight: 600;
        margin: 0;
      }
      h2 {
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 0 0 10px;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        cursor: pointer;
        padding: 0;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
        gap: 8px;
      }
      .nav {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .nav button {
        min-width: 40px;
        height: 40px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--surface);
      }
      .nav .today {
        padding: 0 12px;
        font-size: 0.85rem;
      }
      .month {
        font-size: 1.5rem;
        font-weight: 600;
        margin: 0 0 12px;
        letter-spacing: -0.01em;
      }
      .month span {
        color: var(--muted);
        font-weight: 400;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
      }
      .dow {
        font-size: 0.7rem;
        color: var(--muted);
        text-align: center;
        padding-bottom: 4px;
      }
      .day {
        aspect-ratio: 1/1;
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        font-size: 0.95rem;
        border: 1px solid transparent;
        font-variant-numeric: tabular-nums;
      }
      .day:hover {
        background: var(--surface);
      }
      .day.today {
        border-color: var(--line);
        font-weight: 700;
      }
      .day.sel {
        background: var(--accent);
        color: var(--accent-text);
      }
      .dots {
        display: flex;
        gap: 3px;
        height: 6px;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
      }
      .dot.w {
        background: transparent;
        box-shadow: inset 0 0 0 1.5px var(--muted);
        opacity: 0.6;
      }
      .sel .dot {
        background: var(--accent-text);
      }
      .sel .dot.w {
        background: transparent;
        box-shadow: inset 0 0 0 1.5px var(--accent-text);
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
        margin-top: 20px;
      }
      form {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      input {
        font: inherit;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        min-width: 0;
      }
      input[type="text"] {
        flex: 1 1 180px;
      }
      input[type="date"] {
        flex: 0 1 150px;
      }
      .add {
        background: var(--accent);
        color: var(--accent-text);
        border-radius: 10px;
        padding: 10px 16px;
        font-weight: 600;
      }
      .tabs {
        display: flex;
        gap: 4px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 3px;
        margin-bottom: 8px;
      }
      .tabs button {
        flex: 1;
        padding: 8px 4px;
        border-radius: 8px;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .tabs button[aria-pressed="true"] {
        background: var(--surface);
        color: var(--text);
        font-weight: 600;
        box-shadow: 0 0 0 1px var(--line);
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      li.film {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 0;
        border-top: 1px solid var(--line);
      }
      li.film:first-child {
        border-top: 0;
      }
      .chk {
        flex: none;
        width: 26px;
        height: 26px;
        border-radius: 8px;
        border: 1.5px solid var(--muted);
        display: grid;
        place-items: center;
        color: transparent;
      }
      .chk[aria-checked="true"] {
        background: var(--done);
        border-color: var(--done);
        color: var(--bg);
      }
      .info {
        flex: 1;
        min-width: 0;
      }
      .title {
        overflow-wrap: anywhere;
      }
      .watched .title {
        text-decoration: line-through;
        color: var(--muted);
      }
      .meta {
        font-size: 0.8rem;
        color: var(--muted);
      }
      .del {
        flex: none;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        color: var(--muted);
        font-size: 1.2rem;
      }
      .del:hover {
        color: var(--text);
        background: var(--bg);
      }
      .status {
        font-size: 0.75rem;
        color: var(--muted);
        margin: 0 0 4px;
        min-height: 1.1em;
      }
      .empty {
        color: var(--muted);
        font-size: 0.9rem;
        padding: 8px 0;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="top">
        <h1>🎬 Film calendar</h1>
        <div class="nav">
          <button id="prev" aria-label="Previous month">‹</button>
          <button id="today" class="today">Today</button>
          <button id="next" aria-label="Next month">›</button>
        </div>
      </div>

      <p class="status" id="status" aria-live="polite"></p>
      <p class="month" id="month"></p>
      <div class="grid" id="dow"></div>
      <div class="grid" id="grid" role="grid"></div>

      <section class="card">
        <h2 id="seltitle"></h2>
        <ul id="dayfilms"></ul>
        <form id="form">
          <input
            type="text"
            id="ftitle"
            placeholder="Add a film…"
            maxlength="120"
            required
            aria-label="Film title"
          />
          <input type="date" id="fdate" required aria-label="Release date" />
          <button class="add" type="submit">Add</button>
        </form>
      </section>

      <section class="card">
        <div class="tabs" id="tabs">
          <button data-tab="upcoming">Upcoming</button>
          <button data-tab="towatch">To watch</button>
          <button data-tab="watched">Watched</button>
        </div>
        <ul id="list"></ul>
      </section>
    </main>

    <script>
      (function () {
        var KEY = "filmcal:v1",
          mem = null;
        function load() {
          try {
            var r = localStorage.getItem(KEY);
            if (r) {
              var o = JSON.parse(r);
              if (o && Array.isArray(o.films)) return o.films;
            }
          } catch (e) {}
          return mem || [];
        }
        var ref = null,
          inflight = 0,
          chain = Promise.resolve();
        function setStatus(t) {
          var s = document.getElementById("status");
          if (s) s.textContent = t;
        }
        function save() {
          mem = films;
          try {
            localStorage.setItem(KEY, JSON.stringify({ films: films }));
          } catch (e) {}
          if (!ref) return;
          inflight++;
          setStatus("Saving…");
          var snapshot = films.slice();
          chain = chain
            .then(function () {
              return ref.set({ films: snapshot, updatedAt: Date.now() });
            })
            .then(
              function () {
                inflight--;
                if (!inflight) setStatus("Synced");
              },
              function () {
                inflight--;
                setStatus("Couldn’t sync, saved on this device");
              },
            );
        }
        function pad(n) {
          return n < 10 ? "0" + n : "" + n;
        }
        function iso(d) {
          return (
            d.getFullYear() +
            "-" +
            pad(d.getMonth() + 1) +
            "-" +
            pad(d.getDate())
          );
        }
        function parse(s) {
          var p = s.split("-");
          return new Date(+p[0], +p[1] - 1, +p[2]);
        }
        function esc(s) {
          return s.replace(/[&<>"]/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
          });
        }

        var films = load(),
          now = new Date(),
          todayIso = iso(now);
        var view = { y: now.getFullYear(), m: now.getMonth() },
          sel = todayIso,
          tab = "upcoming";
        var MONTHS = [
          "January",
          "February",
          "March",
          "April",
          "May",
          "June",
          "July",
          "August",
          "September",
          "October",
          "November",
          "December",
        ];
        var DOW = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
        var $ = function (id) {
          return document.getElementById(id);
        };

        $("dow").innerHTML = DOW.map(function (d) {
          return '<div class="dow">' + d + "</div>";
        }).join("");

        function fmt(s) {
          return parse(s).toLocaleDateString("en-GB", {
            weekday: "short",
            day: "numeric",
            month: "short",
            year: "numeric",
          });
        }
        function rel(s) {
          var d = Math.round((parse(s) - parse(todayIso)) / 864e5);
          if (d === 0) return "Today";
          if (d === 1) return "Tomorrow";
          if (d === -1) return "Yesterday";
          return d > 0 ? "In " + d + " days" : Math.abs(d) + " days ago";
        }

        function filmHtml(f) {
          return (
            '<li class="film' +
            (f.watched ? " watched" : "") +
            '">' +
            '<button class="chk" role="checkbox" aria-checked="' +
            f.watched +
            '" aria-label="Mark ' +
            esc(f.title) +
            ' as watched" data-act="toggle" data-id="' +
            f.id +
            '">' +
            '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7.5l3 3 6-7"/></svg></button>' +
            '<div class="info"><div class="title">' +
            esc(f.title) +
            '</div><div class="meta">' +
            fmt(f.date) +
            " · " +
            rel(f.date) +
            "</div></div>" +
            '<button class="del" aria-label="Remove ' +
            esc(f.title) +
            '" data-act="del" data-id="' +
            f.id +
            '">×</button></li>'
          );
        }

        function render() {
          // header + grid
          $("month").innerHTML =
            MONTHS[view.m] + " <span>" + view.y + "</span>";
          var first = new Date(view.y, view.m, 1),
            off = (first.getDay() + 6) % 7,
            n = new Date(view.y, view.m + 1, 0).getDate(),
            h = "";
          for (var i = 0; i < off; i++) h += "<div></div>";
          for (var d = 1; d <= n; d++) {
            var key = view.y + "-" + pad(view.m + 1) + "-" + pad(d);
            var fs = films.filter(function (f) {
              return f.date === key;
            });
            var dots = fs
              .slice(0, 3)
              .map(function (f) {
                return '<i class="dot' + (f.watched ? " w" : "") + '"></i>';
              })
              .join("");
            h +=
              '<button class="day' +
              (key === todayIso ? " today" : "") +
              (key === sel ? " sel" : "") +
              '" data-day="' +
              key +
              '" aria-label="' +
              fmt(key) +
              (fs.length
                ? ", " + fs.length + " film" + (fs.length > 1 ? "s" : "")
                : "") +
              '"><span>' +
              d +
              '</span><span class="dots">' +
              dots +
              "</span></button>";
          }
          $("grid").innerHTML = h;

          // selected day
          $("seltitle").textContent = fmt(sel);
          var df = films.filter(function (f) {
            return f.date === sel;
          });
          $("dayfilms").innerHTML = df.length
            ? df.map(filmHtml).join("")
            : '<li class="empty">No releases on this day.</li>';
          $("fdate").value = sel;

          // tabs + list
          var by = {
            upcoming: films
              .filter(function (f) {
                return !f.watched && f.date >= todayIso;
              })
              .sort(function (a, b) {
                return a.date < b.date ? -1 : 1;
              }),
            towatch: films
              .filter(function (f) {
                return !f.watched && f.date < todayIso;
              })
              .sort(function (a, b) {
                return a.date < b.date ? -1 : 1;
              }),
            watched: films
              .filter(function (f) {
                return f.watched;
              })
              .sort(function (a, b) {
                return a.date < b.date ? 1 : -1;
              }),
          };
          var labels = {
            upcoming: "Upcoming",
            towatch: "To watch",
            watched: "Watched",
          };
          Array.prototype.forEach.call($("tabs").children, function (b) {
            var t = b.dataset.tab;
            b.setAttribute("aria-pressed", t === tab);
            b.textContent = labels[t] + " (" + by[t].length + ")";
          });
          var msgs = {
            upcoming: "Nothing upcoming. Add a release date above.",
            towatch: "You are all caught up.",
            watched: "No watched films yet.",
          };
          $("list").innerHTML = by[tab].length
            ? by[tab].map(filmHtml).join("")
            : '<li class="empty">' + msgs[tab] + "</li>";
        }

        function shift(delta) {
          var d = new Date(view.y, view.m + delta, 1);
          view.y = d.getFullYear();
          view.m = d.getMonth();
          render();
        }
        $("prev").onclick = function () {
          shift(-1);
        };
        $("next").onclick = function () {
          shift(1);
        };
        $("today").onclick = function () {
          todayIso = iso(new Date());
          var t = new Date();
          view = { y: t.getFullYear(), m: t.getMonth() };
          sel = todayIso;
          render();
        };

        $("fdate").onchange = function () {
          if (this.value) {
            sel = this.value;
            var d = parse(sel);
            view = { y: d.getFullYear(), m: d.getMonth() };
            render();
          }
        };

        $("form").onsubmit = function (e) {
          e.preventDefault();
          var t = $("ftitle").value.trim(),
            d = $("fdate").value;
          if (!t || !d) return;
          films.push({
            id:
              Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
            title: t,
            date: d,
            watched: false,
          });
          save();
          $("ftitle").value = "";
          sel = d;
          var p = parse(d);
          view = { y: p.getFullYear(), m: p.getMonth() };
          render();
        };

        document.addEventListener("click", function (e) {
          var el = e.target.closest("[data-day],[data-act],[data-tab]");
          if (!el) return;
          if (el.dataset.day) {
            sel = el.dataset.day;
            render();
            return;
          }
          if (el.dataset.tab) {
            tab = el.dataset.tab;
            render();
            return;
          }
          var id = el.dataset.id;
          if (el.dataset.act === "toggle") {
            films.forEach(function (f) {
              if (f.id === id) f.watched = !f.watched;
            });
          } else if (el.dataset.act === "del") {
            films = films.filter(function (f) {
              return f.id !== id;
            });
          }
          save();
          render();
        });

        render();
        (async function () {
          try {
            var db = await claude.use("db"),
              user = await claude.use("user");
            var uid = user ? await user.id() : null;
            if (!db || !uid) {
              setStatus("Saved on this device only");
              return;
            }
            ref = db.doc("data/users/" + uid + "/films");
            var timer = setTimeout(function () {
              setStatus("Can’t reach sync yet");
            }, 10000);
            ref.onSnapshot(
              function (snap) {
                if (!snap.metadata.fromCache) {
                  clearTimeout(timer);
                  if (!inflight) setStatus("Synced");
                }
                if (inflight) return;
                var d = snap.exists ? snap.data() : null;
                if (d && Array.isArray(d.films)) {
                  films = d.films.slice();
                  mem = films;
                  try {
                    localStorage.setItem(KEY, JSON.stringify({ films: films }));
                  } catch (e) {}
                  render();
                } else if (
                  !snap.exists &&
                  !snap.metadata.fromCache &&
                  films.length
                ) {
                  save();
                }
              },
              function () {
                clearTimeout(timer);
                setStatus("Sync stopped, saved on this device");
              },
            );
          } catch (e) {
            setStatus("Saved on this device only");
          }
        })();
      })();
    </script>
  </body>
</html>
